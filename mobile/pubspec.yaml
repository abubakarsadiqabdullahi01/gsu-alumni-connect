name: gsu_alumni_connect
description: Flutter Android app for GSU Alumni Connect.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  cookie_jar: ^4.0.8
  # Referenced by the adaptive switches/dialogs; without it the build warns
  # about a missing CupertinoIcons font.
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  fl_chart: ^0.69.0
  flutter_animate: ^4.5.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  go_router: ^14.3.0
  google_fonts: ^6.2.1
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
